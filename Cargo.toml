[workspace]
members = ["crates/fairtable-core", "crates/fairtable-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.fairtable-core]
opt-level = "s"
